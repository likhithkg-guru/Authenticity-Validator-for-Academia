<hr>

<h2>Verification Result</h2>

<h3>{{ status }}</h3>

<p>
    <b>Verification Score:</b> {{ score }}%
</p>

<h3>Verification Checks</h3>

{% for check, passed in checks.items() %}

    {% if passed %}
        <p>✅ {{ check }}</p>
    {% else %}
        <p>❌ {{ check }}</p>
    {% endif %}

{% endfor %}
