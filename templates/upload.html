<!DOCTYPE html>
<html>
<head>
    <title>Upload Document</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <h1>Upload Academic Document</h1>

    <form action="/analyze" method="POST" enctype="multipart/form-data">

        <input
            type="file"
            name="document"
            accept=".jpg,.jpeg,.png,.pdf"
            required
        >

        <br><br>

        <button type="submit">
            Analyze Document
        </button>

    </form>

</body>
</html>
